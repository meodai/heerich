<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heerich · Clip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Aboreto&family=Work+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../site.css" />
    <link rel="stylesheet" href="./demo.css" />
    <style>
      /* the docs' look: paper faces, ink lines (site.css's colours, dark
         mode included) */
      /* the box it is clipped to */
      .box {
        fill: none;
        stroke: var(--text);
        stroke-width: 1;
        stroke-dasharray: 4 4;
        vector-effect: non-scaling-stroke;
        opacity: 0.45;
      }
    </style>
  </head>
  <body class="demo-stage">
    <div class="demo-title">
      <h1>Clip</h1>
      <p>
        A shape turning inside a box that stays put: the box clips it, and walls
        close the cut. Made with <a href="../">heerich.js</a>.
      </p>
      <ul class="demo-features">
        <li><a href="../#custom-shapes">Custom shapes (fill)</a></li>
        <li>
          <a href="https://github.com/meodai/heerich#moving-groups"
            >Moving groups</a
          >
        </li>
        <li>
          <a href="https://github.com/meodai/heerich#clipping"
            >Clipping and walls</a
          >
        </li>
      </ul>
    </div>

    <div class="view"><svg id="view"></svg></div>

    <details class="settings-panel visible" id="settings-panel" open>
      <summary class="settings-title">
        Settings <span class="details-icon-closed">▥</span>
      </summary>
      <div class="settings-section-title">Shape</div>
      <div class="settings-fields">
        <label class="control-label" title="The cube's size, in cells">
          <span>Size</span>
          <input type="range" id="size" min="3" max="10" value="6" />
          <span class="control-value">6</span>
        </label>
      </div>
      <div class="settings-section-title">Turn</div>
      <div class="settings-fields">
        <label class="control-label" title="Degrees a second about x">
          <span>Turn x</span>
          <input type="range" id="speed-x" min="-60" max="60" value="23" />
          <span class="control-value">23</span>
        </label>
        <label class="control-label" title="Degrees a second about y">
          <span>Turn y</span>
          <input type="range" id="speed-y" min="-60" max="60" value="37" />
          <span class="control-value">37</span>
        </label>
        <label class="control-label">
          <span>Pause</span>
          <input type="checkbox" id="pause" />
        </label>
      </div>
      <div class="settings-section-title">Camera</div>
      <div class="settings-fields">
        <label class="control-label">
          <span>Type</span>
          <select class="control-select" id="cam-proj">
            <option value="oblique">oblique</option>
            <option value="orthographic">orthographic</option>
            <option value="isometric" selected>isometric</option>
          </select>
        </label>
        <label class="control-label">
          <span>Angle</span>
          <input type="range" id="cam-angle" min="0" max="360" value="30" />
          <span class="control-value">30</span>
        </label>
      </div>
      <div class="settings-section-title">Cut</div>
      <div class="settings-fields">
        <label class="control-label">
          <span>Walls</span>
          <select class="control-select" id="walls">
            <option value="same" selected>same as shape</option>
            <option value="black">black</option>
            <option value="off">off</option>
          </select>
        </label>
        <label class="control-label">
          <span>Box</span>
          <input type="checkbox" id="box" checked />
        </label>
      </div>
    </details>

    <script type="module">
      import { Heerich } from "../../src/heerich.js";

      const $ = (id) => document.getElementById(id);

      // ─── The shape, from the docs' Custom shapes: an s × s × s cube with
      // its corners taken out, a cross on every face. One group, so it can
      // turn. The box it is clipped to is the cube itself, and stays put
      // while the shape turns around the cube's centre.
      const svg = $("view");
      const NS = "http://www.w3.org/2000/svg";
      const faces = svg.appendChild(document.createElementNS(NS, "g"));
      const outline = svg.appendChild(document.createElementNS(NS, "path"));
      outline.setAttribute("class", "box");

      // the docs' face style: paper faces, thin ink lines
      const line = { stroke: "var(--text)", strokeWidth: 0.5 };
      const face = { fill: "var(--bg)", ...line };

      function camera() {
        const type = $("cam-proj").value;
        const angle = +$("cam-angle").value;
        if (type === "oblique") return { type, angle, distance: 10 };
        if (type === "orthographic") return { type, angle, pitch: 30 };
        return { type, angle };
      }

      let h, clip, centre;
      const wallLook = () => $("walls").value;
      function build() {
        const s = +$("size").value;
        h = new Heerich({ tile: 28, camera: camera(), style: face });
        h.applyGeometry({
          type: "fill",
          bounds: [
            [0, 0, 0],
            [s, s, s],
          ],
          test: (x, y, z) => {
            const c = Math.ceil(s / 4);
            const nearEdge = [x, y, z].filter(
              (v) => v < c || v >= s - c,
            ).length;
            return nearEdge < 3;
          },
          style: {
            default: face,
            // the walls where the box cuts: in the ink colour, or (no `cap`
            // style) like the faces around them
            ...(wallLook() === "black"
              ? {
                  cap: {
                    fill: "var(--text)",
                    stroke: "var(--bg)",
                    strokeWidth: 0.5,
                  },
                }
              : {}),
          },
          group: "shape",
        });
        const min = [0, 0, 0],
          max = [s, s, s];
        clip = { min, max };
        centre = [s / 2, s / 2, s / 2];

        // The box's corners and edges: its outline, and a frame that holds
        // still (nothing drawn reaches past the box)
        const corners = [];
        for (const x of [min[0], max[0]])
          for (const y of [min[1], max[1]])
            for (const z of [min[2], max[2]]) corners.push([x, y, z]);
        const pts = corners.map((c) => h.project(c));
        const xs = pts.map((p) => p.x),
          ys = pts.map((p) => p.y);
        const pad = 24;
        svg.setAttribute(
          "viewBox",
          [
            Math.min(...xs) - pad,
            Math.min(...ys) - pad,
            Math.max(...xs) - Math.min(...xs) + pad * 2,
            Math.max(...ys) - Math.min(...ys) + pad * 2,
          ].join(" "),
        );
        let d = "";
        for (let a = 0; a < 8; a++)
          for (let b = a + 1; b < 8; b++)
            if ([1, 2, 4].includes(a ^ b))
              // corners that differ on one axis make an edge
              d += `M${pts[a].x},${pts[a].y}L${pts[b].x},${pts[b].y}`;
        outline.setAttribute("d", d);
      }
      build();

      // ─── Controls: the docs page's panel ───
      function enhanceRange(input) {
        const wrap = document.createElement("div");
        wrap.className = "range-wrap";
        const thumb = document.createElement("span");
        thumb.className = "range-thumb";
        const capL = document.createElement("span");
        capL.className = "range-cap-left";
        const capR = document.createElement("span");
        capR.className = "range-cap-right";
        input.parentNode.insertBefore(wrap, input);
        wrap.append(input, thumb, capL, capR);
        const valueSpan = wrap
          .closest(".control-label")
          .querySelector(".control-value");
        const sync = () => {
          const min = parseFloat(input.min) || 0;
          const max = parseFloat(input.max) || 100;
          wrap.style.setProperty(
            "--val",
            (parseFloat(input.value) - min) / (max - min),
          );
          if (valueSpan) valueSpan.textContent = input.value;
        };
        input.addEventListener("input", sync);
        sync();
      }
      document.querySelectorAll('input[type="range"]').forEach(enhanceRange);
      if (window.matchMedia("(max-width: 56rem)").matches)
        $("settings-panel").removeAttribute("open");

      $("size").addEventListener("input", build);
      $("cam-angle").addEventListener("input", build);
      $("cam-proj").addEventListener("change", build);
      $("walls").addEventListener("change", build);
      $("box").addEventListener("change", (e) => {
        outline.style.display = e.target.checked ? "" : "none";
      });

      // ─── Turn ───
      let ax = 0,
        ay = 0,
        last = 0;
      function frame(now) {
        const dt = Math.min(0.1, (now - (last || now)) / 1000);
        last = now;
        if (!$("pause").checked) {
          ax += +$("speed-x").value * dt;
          ay += +$("speed-y").value * dt;
        }
        h.updateSVG(faces, {
          groups: {
            shape: { rotate: [ax, ay, 0], center: centre },
          },
          clip,
          caps: wallLook() !== "off",
          dataAttributes: false,
          faceAttributes: () => ({ "vector-effect": "non-scaling-stroke" }),
        });
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
